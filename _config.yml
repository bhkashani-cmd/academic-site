# Site settings
title: Dr. Behzad Hassannezhad Kashani
email:
description: >-
  Personal academic website of Dr. Behzad Hassannezhad Kashani, featuring
  research, publications, editorial activities, academic projects,
  and RePEc resources.

url: "https://hasannejad.ir"
baseurl: ""

twitter_username:
github_username: bhkashani-cmd

minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

timezone: Asia/Tehran

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Author Profile
author:
  name: "Dr. Behzad Hassannezhad Kashani"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Researcher, Academic Editor, and Managing Editor of the International Journal of Management, Accounting and Economics (IJMAE)."
  location: "Iran"

  links:
    - label: "Website"
      icon: "fas fa-fw fa-globe"
      url: "https://hasannejad.ir"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bhkashani-cmd"

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bhkashani-cmd"

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: false

  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# Archives
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# Site settings
title: "Dr. Behzad Hassannezhad Kashani"
subtitle: "Researcher | Academic Editor | Scholarly Publishing"

description: >-
  Official academic website of Dr. Behzad Hassannezhad Kashani.
  Research, publications, teaching, editorial activities, and academic resources.

url: "https://hasannejad.ir"
baseurl: ""

minimal_mistakes_skin: "air"

search: true
logo: ""

markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

permalink: /:categories/:title/

paginate: 5
paginate_path: /page:num/

timezone: Asia/Tehran

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache


author:
  name: "Dr. Behzad Hassannezhad Kashani"
  avatar: "/assets/images/profile.jpg"
  bio: "Researcher | Academic Editor | Managing Editor of IJMAE"
  location: "Iran"

  links:

    - label: "Website"
      icon: "fas fa-fw fa-globe"
      url: "https://hasannejad.ir"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bhkashani-cmd"


footer:
  links:

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bhkashani-cmd"


defaults:

  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true


  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true


category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

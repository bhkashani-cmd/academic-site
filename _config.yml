# Site settings
title: "Dr. Behzad Hassannezhad Kashani"
subtitle: "Researcher | Academic Editor | Scholarly Publishing"

description: >-
  Official academic website of Dr. Behzad Hassannezhad Kashani.
  Research, publications, teaching, editorial activities, and academic resources.

url: "https://hasannejad.ir"
baseurl: ""

minimal_mistakes_skin: "default"

search: true

logo: ""

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

permalink: /:categories/:title/

paginate: 5
paginate_path: /page:num/

timezone: Asia/Tehran

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache


# Author Profile
author:
  name: "Dr. Behzad Hassannezhad Kashani"
  avatar: "/assets/images/profile.jpg"
  bio: "Researcher, Academic Editor, and Managing Editor of the International Journal of Management, Accounting and Economics (IJMAE)."
  location: "Iran"

  links:
    - label: "Website"
      icon: "fas fa-fw fa-globe"
      url: "https://hasannejad.ir"

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bhkashani-cmd"

    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "#"

    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "#"

    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "#"


# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bhkashani-cmd"


# Defaults
defaults:

  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: false


  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true


# Archives
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/
